[project]
name = "gridnight-commander"
version = "0.1.0"
description = "GridNight Commander is a GridFS terminal file manager"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "motor>=3.7.1",
    "pymongo>=4.11.3",
    "python-dotenv>=1.0.1",
    "textual>=2.1.2",
    "textual-fspicker>=0.2.1",
]

[tool.uv]
package = true

[project.scripts]
gnc = "gridnight_commander.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a live MongoDB connection (deselect with '-m not integration')",
]

[project.optional-dependencies]
dev = [
    "textual-dev",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]
